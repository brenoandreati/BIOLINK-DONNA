<!doctype html>
<!--
  Modelo da imagem de compartilhamento (1200 × 630).
  Para regenerar public/assets/img/og-image.jpg:
    1. sirva a pasta do projeto (ex.: npx serve .)
    2. abra /tools/og-image.html em uma janela de 1200 × 630
    3. capture a tela e salve como JPG em public/assets/img/og-image.jpg
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>OG — Donna Cerimonial &amp; Eventos</title>
<link rel="stylesheet" href="../public/assets/css/styles.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: grid;
    place-items: center;
    background:
      radial-gradient(60% 70% at 50% 0%, rgba(212, 175, 55, .10), transparent 70%),
      #050505;
  }
  .og {
    width: 1104px;
    height: 534px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .og img { width: 440px; height: auto; }
  .og .invite__headline { max-width: 24ch; margin-top: 22px; font-size: 44px; }
  .og .invite__place { margin-top: 24px; font-size: 14px; }
  .og .invite__place .icon { font-size: 17px; }
  .og, .og * { animation: none !important; }
</style>
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-map-pin" viewBox="0 0 24 24">
      <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/>
      <circle cx="12" cy="10" r="3"/>
    </symbol>
  </svg>
  <div class="og frame">
    <img src="../public/assets/img/logo-donna.webp" alt="Donna Cerimonial &amp; Eventos" width="843" height="432">
    <p class="invite__headline">Não realizamos apenas eventos, <em class="foil">realizamos sonhos.</em></p>
    <p class="invite__place"><svg class="icon" aria-hidden="true"><use href="#i-map-pin"/></svg> Glória, Vila Velha — ES</p>
  </div>
</body>
</html>
