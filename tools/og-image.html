<!doctype html>
<!--
  Modelo da imagem de compartilhamento (1200 × 630).
  Para regenerar assets/img/og-image.jpg depois de adicionar a logo:
    1. sirva a pasta do projeto (ex.: npx serve .)
    2. abra /tools/og-image.html em uma janela de 1200 × 630
    3. capture a tela e salve como JPG em assets/img/og-image.jpg
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>OG — Donna Cerimonial &amp; Eventos</title>
<link rel="stylesheet" href="../assets/css/styles.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    display: grid;
    place-items: center;
    background:
      radial-gradient(60% 70% at 50% 0%, rgba(212, 175, 55, .12), transparent 70%),
      #050505;
  }
  .og {
    width: 1104px;
    height: 534px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .og img { height: 150px; width: auto; margin-bottom: 22px; }
  .og .brand { font-size: 15px; }
  .og:not(:has(img)) .brand__name {
    display: block;
    margin-bottom: 14px;
    font-family: var(--serif);
    font-size: 104px;
    line-height: .95;
    letter-spacing: 0;
    text-transform: none;
  }
  .og:not(:has(img)) .brand__kind { display: block; font-size: 14px; letter-spacing: .42em; }
  .og .invite__headline { max-width: 24ch; font-size: 50px; }
  .og .invite__headline::before { margin: 26px auto; width: 64px; }
  .og .invite__place { margin-top: 26px; font-size: 14px; }
  .og .invite__place .icon { font-size: 17px; }
  .og, .og * { animation: none !important; }
</style>
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-map-pin" viewBox="0 0 24 24">
      <path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/>
      <circle cx="12" cy="10" r="3"/>
    </symbol>
  </svg>
  <div class="og frame">
    <img src="../assets/img/logo.png" alt="" onerror="this.remove()">
    <p class="brand"><span class="brand__name">Donna</span> <span class="brand__kind">Cerimonial &amp; Eventos</span></p>
    <p class="invite__headline">Não realizamos apenas eventos, <em class="foil">realizamos sonhos.</em></p>
    <p class="invite__place"><svg class="icon" aria-hidden="true"><use href="#i-map-pin"/></svg> Glória, Vila Velha — ES</p>
  </div>
</body>
</html>
